services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quillpost
      POSTGRES_USER: quillpost
      POSTGRES_PASSWORD: quillpost_dev
    ports:
      - "5433:5432"
    volumes:
      - quillpost_pg:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quillpost
      SPRING_DATASOURCE_USERNAME: quillpost
      SPRING_DATASOURCE_PASSWORD: quillpost_dev
      JWT_SECRET: replace-with-32-char-minimum-secret-key-here
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  quillpost_pg:
