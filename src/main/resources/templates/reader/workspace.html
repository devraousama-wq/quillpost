<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${workspaceSlug}">Workspace</title>
    <link rel="stylesheet" th:href="@{/css/reader.css}"/>
</head>
<body>
<main>
    <h1 th:text="${workspaceSlug}">workspace</h1>
    <ul>
        <li th:each="post : ${posts}">
            <a th:href="@{'/w/' + ${workspaceSlug} + '/p/' + ${post.slug}}" th:text="${post.title}">title</a>
        </li>
    </ul>
</main>
</body>
</html>
