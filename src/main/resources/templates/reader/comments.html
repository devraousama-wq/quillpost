<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Comments</title>
    <link rel="stylesheet" th:href="@{/css/reader.css}"/>
</head>
<body>
<main>
    <h1>Comments</h1>
    <article th:each="c : ${comments}">
        <header th:text="${c.authorName}">name</header>
        <p th:text="${c.bodyMarkdown}">body</p>
    </article>
</main>
</body>
</html>
